<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizbot -- Admin</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <h1>Quizbot -- Admin</h1>

  <div id="auth-section" class="card" hidden>
    <h3>Connexion admin</h3>
    <form id="login-form">
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Mot de passe">
    <button id="login-btn" type="submit">Se connecter</button>
    </form>
    <p class="error" id="auth-error"></p>
  </div>

  <div id="denied-section" class="card" hidden>
    <p class="error">Accès refusé -- ce compte n'est pas administrateur.</p>
    <button class="secondary" id="logout-denied-btn">Déconnexion</button>
  </div>

  <div id="admin-section" hidden>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <span class="muted">Admin : <strong id="admin-email"></strong></span>
      <button class="secondary" id="logout-btn">Déconnexion</button>
    </div>

    <div class="card">
      <h3>Ventes -- 30 derniers jours</h3>
      <canvas id="sales-chart" height="90"></canvas>
    </div>

    <div class="card">
      <h3>Demandes de retrait en attente</h3>
      <div id="withdrawals-list"><span class="muted">Chargement...</span></div>
    </div>

    <div class="card">
      <h3>Tickets support</h3>
      <div id="tickets-list"><span class="muted">Chargement...</span></div>
    </div>

    <div class="card">
      <h3>Journal d'audit (50 derniers événements)</h3>
      <div id="audit-list"><span class="muted">Chargement...</span></div>
    </div>
  </div>
</div>

<script src="../vendor/chart-4.4.4.js"></script>
<script src="../vendor/supabase-js-2.116.0.js"></script>
<script src="../config.js"></script>
<script src="app.js"></script>
</body>
</html>
