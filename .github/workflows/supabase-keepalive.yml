# Évite la mise en pause automatique du projet Supabase gratuit (inactivité > 7 jours)
# en lui envoyant une vraie requête base de données tous les 3 jours.
# La clé publishable est déjà publique (config.js) : aucun secret requis.
name: supabase-keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"   # tous les 3 jours à 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write            # pour le commit vide anti-désactivation (voir plus bas)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # On interroge « settings » : table lisible par le rôle anonyme PAR CONCEPTION (réglages publics),
      # et c'est une vraie requête SQL, donc elle compte comme activité pour Supabase.
      # Le repli sur « word_answers » est TEMPORAIRE (transition, à retirer à l'intégration 01-08) :
      # une fois la table verrouillée, word_answers renvoie 401, donc le repli ne peut plus masquer
      # une panne de « settings » (l'étape échouera alors, ce qui est voulu).
      - name: Requête vers Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 \
            "https://dvknfvvrqyckimzsvgpm.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_JbdnSPEnPwfmCBwyrysnGw_8EGTHkbA")
          echo "settings: HTTP $code"
          if [ "$code" = "200" ]; then
            exit 0
          fi
          echo "::warning::settings injoignable (HTTP $code) : repli temporaire sur word_answers (transition, à retirer à l'intégration 01-08)"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 \
            "https://dvknfvvrqyckimzsvgpm.supabase.co/rest/v1/word_answers?select=word&limit=1" \
            -H "apikey: sb_publishable_JbdnSPEnPwfmCBwyrysnGw_8EGTHkbA")
          echo "word_answers (repli): HTTP $code"
          [ "$code" = "200" ]

      # GitHub désactive les workflows planifiés d'un dépôt sans commit depuis 60 jours.
      # Si le dernier commit a plus de 45 jours, on en crée un vide pour relancer le compteur.
      - uses: actions/checkout@v4
      - name: Garder le dépôt « actif »
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*24*3600 )) ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (évite la désactivation des workflows planifiés)"
            git push
          fi
